edges:
  # ----- from I -----
  - { from: I,     event: REQ_A_ReadClean,       to: T_FILL_A, action: "SendReadNoSnpToSNF" }
  - { from: I,     event: REQ_B_ReadClean,       to: T_FILL_B, action: "SendReadNoSnpToSNF" }
  - { from: I,     event: REQ_A_ReadUnique,      to: T_FILL_A, action: "SendReadNoSnpToSNF" }
  - { from: I,     event: REQ_B_ReadUnique,      to: T_FILL_B, action: "SendReadNoSnpToSNF" }
  - { from: I,     event: REQ_A_MakeUnique,      to: T_ACK_A,  action: "SendComp(UC)" }
  - { from: I,     event: REQ_B_MakeUnique,      to: T_ACK_B,  action: "SendComp(UC)" }

  # ----- T_FILL_* -> stable on SNF return -----
  # For simplicity, ReadClean lands the requester in SC_*, ReadUnique in UC_*.
  # The driver picks which by remembering the issuing REQ; we encode both as
  # available transitions and let the BFS keep both branches (the oracle
  # disambiguates by stored intent).
  - { from: T_FILL_A, event: SNF_DATA_AS_ReadClean,  to: T_ACK_A, action: "SendCompData(SC)" }
  - { from: T_FILL_A, event: SNF_DATA_AS_ReadUnique, to: T_ACK_A, action: "SendCompData(UC)" }
  - { from: T_FILL_B, event: SNF_DATA_AS_ReadClean,  to: T_ACK_B, action: "SendCompData(SC)" }
  - { from: T_FILL_B, event: SNF_DATA_AS_ReadUnique, to: T_ACK_B, action: "SendCompData(UC)" }

  # ----- T_ACK_* -> stable on CompAck -----
  # Stable-state choice depends on intent recorded by driver; expose both.
  - { from: T_ACK_A, event: COMPACK_A_ReadClean,  to: SC_A, action: "RetireMSHR" }
  - { from: T_ACK_A, event: COMPACK_A_ReadUnique, to: UC_A, action: "RetireMSHR" }
  - { from: T_ACK_A, event: COMPACK_A_MakeUnique, to: UC_A, action: "RetireMSHR" }
  - { from: T_ACK_B, event: COMPACK_B_ReadClean,  to: SC_B, action: "RetireMSHR" }
  - { from: T_ACK_B, event: COMPACK_B_ReadUnique, to: UC_B, action: "RetireMSHR" }
  - { from: T_ACK_B, event: COMPACK_B_MakeUnique, to: UC_B, action: "RetireMSHR" }

  # ----- from SC_A -----
  - { from: SC_A,  event: REQ_A_Evict,            to: I,        action: "CompOnly" }
  - { from: SC_A,  event: REQ_A_CleanUnique,      to: T_ACK_A,  action: "SendComp(UC,noSnp)" }
  - { from: SC_A,  event: REQ_B_ReadClean,        to: T_SNP_B,  action: "SnpClean(A)" }
  - { from: SC_A,  event: REQ_B_ReadUnique,       to: T_SNP_B,  action: "SnpUnique(A)" }
  - { from: SC_A,  event: REQ_B_CleanUnique,      to: T_SNP_B,  action: "SnpMakeInvalid(A)" }
  - { from: SC_A,  event: REQ_B_MakeUnique,       to: T_SNP_B,  action: "SnpMakeInvalid(A)" }
  - { from: SC_A,  event: REQ_B_CleanInvalid,     to: T_SNP_B,  action: "SnpCleanInvalid(A)" }

  # ----- from SC_B (mirror of SC_A) -----
  - { from: SC_B,  event: REQ_B_Evict,            to: I,        action: "CompOnly" }
  - { from: SC_B,  event: REQ_B_CleanUnique,      to: T_ACK_B,  action: "SendComp(UC,noSnp)" }
  - { from: SC_B,  event: REQ_A_ReadClean,        to: T_SNP_A,  action: "SnpClean(B)" }
  - { from: SC_B,  event: REQ_A_ReadUnique,       to: T_SNP_A,  action: "SnpUnique(B)" }
  - { from: SC_B,  event: REQ_A_CleanUnique,      to: T_SNP_A,  action: "SnpMakeInvalid(B)" }
  - { from: SC_B,  event: REQ_A_MakeUnique,       to: T_SNP_A,  action: "SnpMakeInvalid(B)" }
  - { from: SC_B,  event: REQ_A_CleanInvalid,     to: T_SNP_A,  action: "SnpCleanInvalid(B)" }

  # ----- T_SNP_* -> stable on SnpResp -----
  # A is requester here, B is the snooped peer (and vice versa).
  - { from: T_SNP_A, event: SNP_RESP_B_I_FOR_ReadClean,  to: T_ACK_A, action: "SendCompData(SC)" }
  - { from: T_SNP_A, event: SNP_RESP_B_SC_FOR_ReadClean, to: T_ACK_A, action: "SendCompData(SC)" }
  - { from: T_SNP_A, event: SNP_RESP_B_I_FOR_ReadUnique, to: T_ACK_A, action: "SendCompData(UC)" }
  - { from: T_SNP_A, event: SNP_RESP_B_I_FOR_CleanUnique,to: T_ACK_A, action: "SendComp(UC)" }
  - { from: T_SNP_A, event: SNP_RESP_B_I_FOR_MakeUnique, to: T_ACK_A, action: "SendComp(UCE)" }
  - { from: T_SNP_A, event: SNP_RESP_B_I_FOR_CleanInval, to: T_ACK_A, action: "SendComp" }

  - { from: T_SNP_B, event: SNP_RESP_A_I_FOR_ReadClean,  to: T_ACK_B, action: "SendCompData(SC)" }
  - { from: T_SNP_B, event: SNP_RESP_A_SC_FOR_ReadClean, to: T_ACK_B, action: "SendCompData(SC)" }
  - { from: T_SNP_B, event: SNP_RESP_A_I_FOR_ReadUnique, to: T_ACK_B, action: "SendCompData(UC)" }
  - { from: T_SNP_B, event: SNP_RESP_A_I_FOR_CleanUnique,to: T_ACK_B, action: "SendComp(UC)" }
  - { from: T_SNP_B, event: SNP_RESP_A_I_FOR_MakeUnique, to: T_ACK_B, action: "SendComp(UCE)" }
  - { from: T_SNP_B, event: SNP_RESP_A_I_FOR_CleanInval, to: T_ACK_B, action: "SendComp" }

  # CompAck post-snoop variants (resolve T_ACK from snoop-induced fills)
  - { from: T_ACK_A, event: COMPACK_A_CleanUnique, to: UC_A, action: "RetireMSHR" }
  - { from: T_ACK_A, event: COMPACK_A_CleanInval,  to: I,    action: "RetireMSHR" }
  - { from: T_ACK_B, event: COMPACK_B_CleanUnique, to: UC_B, action: "RetireMSHR" }
  - { from: T_ACK_B, event: COMPACK_B_CleanInval,  to: I,    action: "RetireMSHR" }

  # ----- from UC_A -----
  - { from: UC_A,  event: REQ_A_WriteBackFull,    to: I,       action: "SendDBIDResp" } # simplified: WB clears line
  - { from: UC_A,  event: REQ_A_Evict,            to: I,       action: "CompOnly" }
  - { from: UC_A,  event: REQ_B_ReadClean,        to: T_SNP_B, action: "SnpClean(A)" }
  - { from: UC_A,  event: REQ_B_ReadUnique,       to: T_SNP_B, action: "SnpUnique(A)" }

  # ----- from UC_B -----
  - { from: UC_B,  event: REQ_B_WriteBackFull,    to: I,       action: "SendDBIDResp" }
  - { from: UC_B,  event: REQ_B_Evict,            to: I,       action: "CompOnly" }
  - { from: UC_B,  event: REQ_A_ReadClean,        to: T_SNP_A, action: "SnpClean(B)" }
  - { from: UC_B,  event: REQ_A_ReadUnique,       to: T_SNP_A, action: "SnpUnique(B)" }

  # ----- snoop from UC_*: SnpClean can return SC (downgrade) or I -----
  # These edges allow BFS to reach SC_AB via the UC_*-SnpClean path.
  - { from: T_SNP_B, event: SNP_RESP_A_SC_FOR_ReadClean_FROM_UC, to: SC_AB, action: "SendCompData(SC),AendsSC" }
  - { from: T_SNP_A, event: SNP_RESP_B_SC_FOR_ReadClean_FROM_UC, to: SC_AB, action: "SendCompData(SC),BendsSC" }

  # ----- from SC_AB -----
  - { from: SC_AB, event: REQ_A_Evict,            to: SC_B,    action: "CompOnly" }
  - { from: SC_AB, event: REQ_B_Evict,            to: SC_A,    action: "CompOnly" }
  - { from: SC_AB, event: REQ_A_CleanUnique,      to: T_SNP_A, action: "SnpMakeInvalid(B)" }
  - { from: SC_AB, event: REQ_B_CleanUnique,      to: T_SNP_B, action: "SnpMakeInvalid(A)" }

  # ----- from UD_* (UD reached via writes — modeled as: WriteUniqueFull lands UC, dirty-promote via internal store) -----
  # Kept minimal here; BFS coverage for UD requires extending the model.
  - { from: UC_A,  event: INT_StoreHit_A,         to: UD_A,    action: "MarkDirty" }
  - { from: UC_B,  event: INT_StoreHit_B,         to: UD_B,    action: "MarkDirty" }
  - { from: UD_A,  event: REQ_A_WriteBackFull,    to: I,       action: "AcceptCBData" }
  - { from: UD_B,  event: REQ_B_WriteBackFull,    to: I,       action: "AcceptCBData" }
  - { from: UD_A,  event: REQ_B_ReadUnique,       to: T_SNP_B, action: "SnpUnique(A,DataXfer)" }
