# HN-F Coherence FSM — hand-curated subset for the test-case generator.
#
# Model: a single cache line, two RN-Fs (A, B). States encode the HN-F's
# view of the line + ownership. Transients capture mid-transaction state
# (snoop pending, SNF fill pending, CompAck pending). Each edge is one
# input event the HN-F observes — either an RN-F-issued REQ (event prefix
# REQ_A_ / REQ_B_) or an internal completion (SNF_DATA, SNP_RESP_*,
# COMPACK_*).
#
# ── RTL provenance ─────────────────────────────────────────────────────
# Snoop opcode emission table is per
# cva6-RNF/opennoc/rtl/src/hnf/hnf_mshr_ctl.v:1963-1987:
#
#   REQ                  →   Snoop emitted
#   ──────────────────────────────────────────
#   ReadOnce             →   SnpOnce
#   ReadUnique  (L3 miss)→   SnpUnique
#   ReadUnique  (L3 hit) →   SnpMakeInvalid
#   ReadNotSharedDirty   →   SnpNotSharedDirty
#   ReadClean            →   SnpClean
#   WriteUniquePtl       →   SnpUnique
#   WriteUniqueFull      →   SnpMakeInvalid
#   CleanShared          →   SnpCleanShared
#   CleanUnique          →   SnpCleanInvalid
#   CleanInvalid         →   SnpCleanInvalid
#   MakeUnique           →   SnpMakeInvalid
#
# With DCT (Direct Cache Transfer) enabled, the opcode emitted is
# +0x10 above (Fwd variant: SnpCleanFwd 0x12, SnpUniqueFwd 0x17, etc.) —
# hnf_mshr_ctl.v:2991. The model does not distinguish DCT/non-DCT today.
#
# Snoop-filter state encoding (hnf_defines.v:85-87) — per RN-F:
#   SF_I = 2'b00 (Invalid)        ← maps to "I" in this model
#   SF_U = 2'b01 (Unique)         ← maps to UC_*/UD_* in this model
#   SF_S = 2'b11 (Shared)         ← maps to SC_* in this model
#   2'b10 is illegal (HNF $fatal in cache_pipeline.v:2294)
#
# Bypass classification (hnf_mshr_bypass.v:186-193): these REQs DO NOT
# allocate a regular MSHR slot (mshr_alloc_en_s1_q never fires) — they
# take a fast path that returns DBIDResp/Comp directly. Marked in actions
# with the "(BYPASS)" tag so the oracle/observer know not to expect an
# ALLOC line on hnf_mshr_ctl for these.
#
#   req_cb_s0  : WriteBackFull, WriteEvictFull, WriteCleanFull
#   req_rd_s0  : ReadOnce, ReadNoSnp
#   req_wrnosnp_s0: WriteNoSnpFull, WriteNoSnpPtl
#
# Stable line states:
#   I       invalid (no RN-F caches it)
#   SC_A    Shared-Clean, A is the (sole) sharer
#   SC_B    Shared-Clean, B is the (sole) sharer
#   SC_AB   Shared-Clean, both A and B
#   UC_A    Unique-Clean held by A
#   UC_B    Unique-Clean held by B
#   UD_A    Unique-Dirty held by A
#   UD_B    Unique-Dirty held by B
#
# Transient states (MSHR active; carry requester id in the name):
#   T_FILL_A      awaiting ReadNoSnp data from SNF, requester=A
#   T_FILL_B      same, requester=B
#   T_SNP_A       snoops sent to peer(s), awaiting SnpResp, requester=A
#   T_SNP_B       same, requester=B
#   T_ACK_A       Comp/CompData sent, awaiting CompAck from A
#   T_ACK_B       same, B
#
# ── CAM-hazard handling (see hnf_mshr_bypass.v:400, rxreq_cam_hazard_s1_q)
# When a new REQ arrives for a line whose MSHR is already busy (i.e. the
# HNF is in one of the transient states above for that line), the HNF
# detects via the CAM hazard and either:
#   (a) sends RetryAck if the incoming REQ has AllowRetry=1 (default in
#       chi_tlm_rnf), forcing the requester to wait for PCrdGrant and
#       re-issue, OR
#   (b) stalls the new REQ in a holding slot if AllowRetry=0, releasing
#       it after the in-flight MSHR retires.
#
# Modelled below as self-loop edges on each transient state with the
# action prefix "CAM_HAZARD:" so coverage / oracle can identify them.
# Exercising these in sim requires concurrent REQ arrival inside the
# transient window — only the cross-burst (FORK/JOIN) mechanism reaches
# this; sequential do_*() helpers block too tightly to overlap.

initial: I

states:
  # ---------- stable ----------
  I:        { transient: false }
  SC_A:     { transient: false }
  SC_B:     { transient: false }
  SC_AB:   { transient: false }
  UC_A:    { transient: false }
  UC_B:    { transient: false }
  UD_A:    { transient: false }
  UD_B:    { transient: false }
  # ---------- transient ----------
  T_FILL_A: { transient: true }
  T_FILL_B: { transient: true }
  T_SNP_A:  { transient: true }
  T_SNP_B:  { transient: true }
  T_ACK_A:  { transient: true }
  T_ACK_B:  { transient: true }

